<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechSphere Crawl Report</title><link rel="stylesheet" href="../site/css/styles.css"><style>body{padding:30px}.dash{max-width:1100px;margin:auto}.dash h1{font-family:var(--font-display);font-size:clamp(38px,6vw,64px);font-weight:400}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border:1px solid #333;padding:18px;border-radius:14px}.metric strong{display:block;font-size:28px}.metric span{font-size:12px;color:#999}.upload{padding:20px;border:1px dashed #555;border-radius:12px;margin:20px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:10px;border-bottom:1px solid #333}th{color:#aaa}@media(max-width:650px){.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="dash"><div class="eyebrow">TechSphere / Analysis</div><h1>Crawl Report</h1><p class="page-lead">Load the CSV exported by the Python crawler to inspect page discovery, status, depth and content size.</p><div class="upload"><label for="csvFile">Choose crawl_report.csv</label><br><input id="csvFile" type="file" accept=".csv"></div><div class="metrics"><div class="metric"><strong id="total">—</strong><span>Records</span></div><div class="metric"><strong id="ok">—</strong><span>Successful fetches</span></div><div class="metric"><strong id="depth">—</strong><span>Maximum depth</span></div><div class="metric"><strong id="words">—</strong><span>Total words</span></div></div><h2 class="section-heading" style="margin-top:36px">Page records</h2><div class="table-wrap"><table><thead><tr><th>Status</th><th>Depth</th><th>Title</th><th>Words</th><th>URL</th></tr></thead><tbody id="rows"><tr><td colspan="5">Upload a crawl_report.csv file to begin.</td></tr></tbody></table></div></main><script>
const input=document.querySelector('#csvFile');input.addEventListener('change',async()=>{const f=input.files[0];if(!f)return;const lines=(await f.text()).trim().split(/\\r?\\n/);const parse=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'&&q){cur+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out};const head=parse(lines.shift());const data=lines.map(l=>Object.fromEntries(parse(l).map((v,i)=>[head[i],v])));document.querySelector('#total').textContent=data.length;document.querySelector('#ok').textContent=data.filter(x=>String(x.status)==='200').length;document.querySelector('#depth').textContent=Math.max(0,...data.map(x=>Number(x.depth)||0));document.querySelector('#words').textContent=data.reduce((a,x)=>a+(Number(x.word_count)||0),0).toLocaleString();const body=document.querySelector('#rows');body.replaceChildren();data.forEach(x=>{const tr=document.createElement('tr');[x.status,x.depth,x.title,x.word_count,x.url].forEach(v=>{const td=document.createElement('td');td.textContent=v||'';tr.append(td)});body.append(tr)})});
</script></body></html>
